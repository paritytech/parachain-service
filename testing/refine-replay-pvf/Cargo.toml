[package]
name = "refine-replay-pvf"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
codec = { workspace = true }
parachain-service-core = { workspace = true }
polkavm-derive = { workspace = true }

[features]
default = ["std"]
