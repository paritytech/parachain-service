# EXPERIMENT — not part of the product. See `../README.md`.
[package]
name = "parachain-authorizer-sr25519-experiment-bin"
version = "0.1.0"
edition = "2021"
authors = ["Parity Technologies <admin@parity.io>"]
repository = "https://github.com/paritytech/parachain-service"
license = "Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
jam-pvm-builder = { version = "0.1.28" }

[build-dependencies]
pvm-builder = { path = "../../tools/pvm-builder" }
parachain-authorizer-sr25519-experiment = { path = ".." }

# `tests/gas.rs` only. It drives both blobs through the PolkaJAM interpreter itself instead of
# reusing `tools/executor` + `parachain-service-bin::mock`, because that harness does not compile
# against the `vendor/polkajam` commit this branch is pinned to (see `../README.md`).
[dev-dependencies]
parachain-authorizer-sr25519-experiment = { path = ".." }
parachain-authorizer = { path = "../../authorizer" }
parachain-authorizer-bin = { path = "../../authorizer/bin" }
jam-node = { path = "../../vendor/polkajam/crates/node", default-features = false, features = ["hazmat"] }
jam-std-common = { path = "../../vendor/polkajam/crates/jam-std-common" }
jam-types = { path = "../../vendor/polkajam/crates/jam-types", features = ["std"] }
codec = { version = "3.7", package = "parity-scale-codec", features = ["derive", "std"] }
primitive-types = { version = "0.13.1", features = ["codec"] }
ed25519-dalek = { version = "2", features = ["std"] }
schnorrkel = "0.11.5"
