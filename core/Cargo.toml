[package]
name = "parachain-service-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

# Shared wire types, storage helpers, and PVM host wrappers.

[lints]
workspace = true

[dependencies]
cumulus-aura-authorizer = { workspace = true }
polkadot-parachain-primitives = { workspace = true }
sp-crypto-hashing = { workspace = true }
bounded-collections = { workspace = true }
codec = { workspace = true }
jam-pvm-common = { workspace = true, features = ["service"] }
jam-types = { workspace = true }
num_enum = { workspace = true }

[target.'cfg(any(target_arch = "riscv32", target_arch = "riscv64"))'.dependencies]
polkavm-derive = { workspace = true }
# JAM guests provide their own allocator and panic handler.
sp-io = { workspace = true, features = ["disable_allocator", "disable_panic_handler"] }
# Published parachain primitives pull a separate registry copy of sp-io.
sp-io-published = { package = "sp-io", version = "48.0.0", default-features = false, features = ["disable_allocator", "disable_panic_handler"] }

[dev-dependencies]
jam-null-authorizer-bin = { workspace = true }
# Byte-pin the derivation and the trie roots against polkajam's own (std-only)
# implementations, so this crate cannot drift from the node that serves the proofs.
codec = { workspace = true, features = ["std"] }
jam-std-common = { workspace = true }
polkajam-trie = { workspace = true }

[features]
default = []
std = [
	"cumulus-aura-authorizer/std",
	"polkadot-parachain-primitives/std",
	"sp-crypto-hashing/std",
	"bounded-collections/std",
	"codec/std",
	"jam-pvm-common/std",
	"jam-types/std",
	"num_enum/std",
]
