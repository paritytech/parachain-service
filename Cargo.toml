[workspace]
members = [
    "authorizer",
    "authorizer/bin",
    "cumulus",
    "cumulus/jam-interface",
    "cumulus/jam-rpc-interface",
    "cumulus/jam-state-helpers",
    "runtimes/frameless",
    "service",
    "service/bin",
    "service-interface",
    "testing/mock-dest-service",
    "testing/parasim-service",
    "testing/parasim-service/bin",
    "tools/executor",
    "tools/parasim-tool",
    "tools/pvm-builder",
]
exclude = [
    "vendor/polkadot-sdk-companion",
    "vendor/polkajam",
    # An experiment, not part of the product: `authorizer-sr25519-experiment/README.md` says what
    # it measures. Its own workspace on purpose, so a normal workspace build never touches it.
    "authorizer-sr25519-experiment",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Parity Technologies <admin@parity.io>"]
repository = "https://github.com/paritytech/parachain-service"
license = "Apache-2.0"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [] }

[workspace.dependencies]
jam-types = { path = "vendor/polkajam/crates/jam-types", default-features = false }
jam-codec = { version = "0.1.1", default-features = false, features = ["derive"] }
jam-pvm-common = { path = "vendor/polkajam/crates/jam-pvm-common", default-features = false }
jam-std-common = { path = "vendor/polkajam/crates/jam-std-common" }
polkajam-trie = { package = "trie", path = "vendor/polkajam/crates/trie" }
jam-null-authorizer-bin = { path = "vendor/polkajam/services/null-authorizer-bin" }
jam-bootstrap-service-common = { path = "vendor/polkajam/services/bootstrap-service/common", features = ["std"] }
sp-core = { path = "vendor/polkadot-sdk-companion/substrate/primitives/core", default-features = false }
async-stream = "0.3"
async-trait = "0.1"
bytes = { version = "1.7.1", default-features = false }
futures = "0.3"
jsonrpsee = { version = "0.26.0", default-features = false }
serde = { version = "1", default-features = false }
serde_json = "1"
tokio = { version = "1", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive", "env"] }
url = "2.5"
binary-merkle-tree = { version = "16.1.1", default-features = false }
blake2b_simd = { version = "1", default-features = false }
ed25519-dalek = { version = "2", default-features = false }
primitive-types = { version = "0.13.1", default-features = false, features = ["codec"] }
jam-pvm-builder = { version = "0.1.28" }
polkavm-derive = { version = "0.36.0", default-features = false }
bounded-collections = { version = "0.3.2", default-features = false, features = ["scale-codec"] }
polkavm = { version = "0.30.0", default-features = false }
num_enum = { version = "0.7", default-features = false }

# Guest crates and their blob builder crates.
frameless = { path = "runtimes/frameless" }
mock-dest-service = { path = "testing/mock-dest-service" }
parachain-service = { path = "service" }
parachain-service-bin = { path = "service/bin" }
parachain-authorizer = { path = "authorizer" }
parachain-authorizer-bin = { path = "authorizer/bin" }
parachain-service-interface = { path = "service-interface", default-features = false }
parasim-service = { path = "testing/parasim-service" }
jam-interface = { path = "cumulus/jam-interface" }
jam-rpc-interface = { path = "cumulus/jam-rpc-interface" }
jam-state-helpers = { path = "cumulus/jam-state-helpers", default-features = false }

codec = { version = "3.7", package = "parity-scale-codec", default-features = false, features = ["derive"] }
# The frameless PVF is built by `tools/pvm-builder` (polkavm-linker 0.30), NOT by the vendored
# companion's `substrate-wasm-builder` (whose workspace pins polkavm-linker 0.36): a 0.36-linked
# blob emits `unlikely`/wide instructions the vendored polkajam host (`polkavm 0.30`) can't decode,
# trapping the inner PVM. `sp-io` stays sourced from the vendored companion (single SDK source).
executor = { path = "tools/executor" }
pvm-builder = { path = "tools/pvm-builder" }
tiny-keccak = { version = "2.0.2", default-features = false, features = ["keccak"] }
sp-io = { path = "vendor/polkadot-sdk-companion/substrate/primitives/io", default-features = false }

[profile.production]
inherits = "release"
lto = true
codegen-units = 1
debug = false
debug-assertions = false
overflow-checks = false

# Authorizer blobs have a hard 64 kB ceiling (`C_maxauthcodesize`) and 50 M gas for one call;
# service blobs have 4 MB and gas that is actually under pressure. So they are optimised for
# different things: `tools/pvm-builder` builds authorizers with this profile and services with
# `production`.
[profile.production-authorizer]
inherits = "production"
opt-level = "z"
