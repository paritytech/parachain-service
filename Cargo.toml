[workspace]
members = []
exclude = [
    "vendor/polkadot-sdk-companion",
    "vendor/polkajam",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Parity Technologies <admin@parity.io>"]
repository = "https://github.com/paritytech/parachain-service"
license = "Apache-2.0"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [] }

[workspace.dependencies]

[profile.production]
inherits = "release"
lto = true
codegen-units = 1
debug = false
debug-assertions = false
overflow-checks = false
