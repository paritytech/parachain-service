[workspace]
members = [
    "authorizer",
    "authorizer-ed25519",
    "authorizer-sr25519",
    "chain-spec",
    "core",
    "runtimes/frameless",
    "service",
    "service/bin",
    "testing/mock-dest-service",
    "testing/refine-replay-pvf",
    "tools/executor",
]
exclude = [
    "vendor/polkadot-sdk-companion",
    "vendor/polkajam",
    # An experiment, not part of the product: `authorizer-sr25519-experiment/README.md` says what
    # it measures. Its own workspace on purpose, so a normal workspace build never touches it.
    "authorizer-sr25519-experiment",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Parity Technologies <admin@parity.io>"]
repository = "https://github.com/paritytech/parachain-service"
license = "Apache-2.0"

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [] }

[workspace.dependencies]
cumulus-aura-authorizer-utils = { path = "vendor/polkadot-sdk-companion/cumulus/jam/aura-authorizer-utils", default-features = false }
polkadot-parachain-primitives = { version = "23.0.0", default-features = false }
jam-types = { path = "../polkajam2/crates/jam-types", default-features = false }
jam-codec = { version = "0.1.1", default-features = false, features = ["derive"] }
jam-pvm-common = { path = "../polkajam2/crates/jam-pvm-common", default-features = false }
jam-program-blob-common = { path = "../polkajam2/crates/jam-program-blob/common", default-features = false }
jam-std-common = { path = "../polkajam2/crates/jam-std-common" }
jam-null-authorizer-bin = { path = "../polkajam2/services/null-authorizer-bin" }
jam-bootstrap-service-common = { path = "../polkajam2/services/bootstrap-service/common", features = ["std"] }
# Unpublished Polkajam crates remain vendored.
polkajam-trie = { package = "trie", path = "../polkajam2/crates/trie" }
cargo-jam-build = { path = "../polkajam2/crates/cargo-jam-build" }
jam-chainspec = { path = "../polkajam2/crates/jam-chainspec" }
sp-core = { path = "vendor/polkadot-sdk-companion/substrate/primitives/core", default-features = false }
sp-keystore = { path = "vendor/polkadot-sdk-companion/substrate/primitives/keystore" }
async-stream = "0.3"
async-trait = "0.1"
bytes = { version = "1.7.1", default-features = false }
jsonrpsee = { version = "0.26.0", default-features = false }
serde = { version = "1", default-features = false }
serde_json = "1"
binary-merkle-tree = { version = "16.1.1", default-features = false }
blake2b_simd = { version = "1", default-features = false }
ed25519-dalek = { version = "2", default-features = false }
schnorrkel = { version = "0.11.5", default-features = false }
primitive-types = { version = "0.13.1", default-features = false, features = ["codec"] }
polkavm-derive = { version = "0.36.0", default-features = false }
bounded-collections = { version = "0.3.2", default-features = false, features = ["scale-codec"] }
polkavm = { version = "0.36.0", default-features = false }
num_enum = { version = "0.7", default-features = false }

# Guest crates and their blob builder crates.
frameless = { path = "runtimes/frameless" }
mock-dest-service = { path = "testing/mock-dest-service" }
parachain-service = { path = "service" }
parachain-service-bin = { path = "service/bin" }
parachain-authorizer = { path = "authorizer" }
parachain-authorizer-ed25519 = { path = "authorizer-ed25519" }
parachain-authorizer-sr25519 = { path = "authorizer-sr25519" }
parachain-service-core = { path = "core", default-features = false }

codec = { version = "3.7", package = "parity-scale-codec", default-features = false, features = ["derive"] }
thiserror = "2.0"
# This crate parses the child PVF blobs the service drives as an inner PVM. It is pinned at 0.36
# to match polkajam post-gp-v0.8.0 (polkajam bumped its polkavm 0.30 -> 0.36) and the SDK's
# wasm-builder (polkavm-linker 0.35), so the blobs this service drives parse with a version whose
# instruction set and section layout match what linked them. The vendored polkajam submodule has
# moved to the merged gp-v0.8.0 HEAD (`2c34621b`, polkavm-linker 0.36), which drags in gp-v0.8.0's
# ~8x gas-schedule change; the gas pins in `service/bin/tests/accumulate_gas.rs` are re-baselined
# to the measured values of the new model. `sp-io` stays sourced from the vendored companion
# (single SDK source).
executor = { path = "tools/executor" }
tiny-keccak = { version = "2.0.2", default-features = false, features = ["keccak"] }
# The published crate (same source as the companion's copy): a consumer with its own polkadot-sdk
# tree (cumulus) cannot hold a second path crate named `sp-crypto-hashing`.
sp-crypto-hashing = { version = "0.1.0", default-features = false }
sp-io = { path = "vendor/polkadot-sdk-companion/substrate/primitives/io", default-features = false }

# Use the same JAM types for the service and the SDK AURA utilities.
[patch.crates-io]
jam-types = { path = "../polkajam2/crates/jam-types" }

[patch."ssh://git@github.com/paritytech/polkajam.git"]
jam-std-common = { path = "../polkajam2/crates/jam-std-common" }
jam-types = { path = "../polkajam2/crates/jam-types" }

# Optimized host tests and fuzzing with runtime correctness checks retained.
[profile.testnet]
inherits = "release"
lto = true
codegen-units = 1
debug-assertions = true
overflow-checks = true

[profile.production]
inherits = "release"
lto = true
codegen-units = 1
debug = false
debug-assertions = false
overflow-checks = false

# Authorizer blobs have a hard 64 kB ceiling (`C_maxauthcodesize`) and 50 M gas for one call;
# service blobs have 4 MB and gas that is actually under pressure. So they are optimised for
# different things, and each authorizer crate names this profile in its own
# `[package.metadata.jam]` — at `production` they come out around 87 kB, over the ceiling.
[profile.production-authorizer]
inherits = "production"
opt-level = "z"
