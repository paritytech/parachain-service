[package]
name = "frameless"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
codec = { workspace = true }
tiny-keccak = { workspace = true }
blake2b_simd = { workspace = true }
sp-io = { workspace = true }
parachain-service-core = { workspace = true }

[target.'cfg(target_arch = "riscv64")'.dependencies]
polkavm-derive = { workspace = true }
sp-io = { workspace = true, features = ["disable_allocator", "disable_panic_handler"] }

[features]
default = [
	"std",
]
std = [
	"blake2b_simd/std",
	"codec/std",
	"parachain-service-core/std",
	"sp-io/std",
]

[lints]
workspace = true

[package.metadata.jam]
type = "generic"
cargo-args = ["--no-default-features"]
rustflags = ["--cfg", "substrate_runtime"]
# A PVF is entered by name: the service resolves `jam_validate_block` and runs it as a nested
# PVM, so it needs the export table and the raw program rather than a JAM container.
keep-symbols = true
