[package]
name = "frameless"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
codec = { workspace = true }
tiny-keccak = { workspace = true }
# Supplies the guest's global allocator / panic handler / OOM handler (see lib.rs).
sp-io = { workspace = true }

# Only used by the PolkaVM guest build (the `validate_block` export); the host (`std`)
# build never references it, so keep it off the host dependency graph.
[target.'cfg(target_arch = "riscv64")'.dependencies]
polkavm-derive = { workspace = true }

[features]
default = [
	"std",
]
std = [
	"codec/std",
	"sp-io/std",
	"substrate-wasm-builder",
]

[build-dependencies]
substrate-wasm-builder = { workspace = true, optional = true }

[lints]
workspace = true
