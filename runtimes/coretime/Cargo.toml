[package]
name = "coretime"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
codec = { workspace = true }
scale-info = { workspace = true }
frame = { workspace = true }

coretime-system = { workspace = true }

[features]
default = [
	"std",
]
std = [
	"codec/std",
	"coretime-system/std",
	"frame/std",
	"scale-info/std",
	"substrate-wasm-builder",
]
runtime-benchmarks = [
	"coretime-system/runtime-benchmarks",
	"frame/runtime-benchmarks",
]
try-runtime = [
	"coretime-system/try-runtime",
	"frame/try-runtime",
]

[build-dependencies]
substrate-wasm-builder = { workspace = true, optional = true }

[lints]
workspace = true
