[package]
name = "asset-hub"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
codec = { workspace = true }
scale-info = { workspace = true }
frame = { workspace = true }

asset-hub-system = { workspace = true }

[features]
default = ["std"]
std = [
	"asset-hub-system/std",
	"codec/std",
	"frame/std",
	"scale-info/std",
	"substrate-wasm-builder",
]
runtime-benchmarks = [
	"asset-hub-system/runtime-benchmarks",
	"frame/runtime-benchmarks",
]
try-runtime = [
	"asset-hub-system/try-runtime",
	"frame/try-runtime",
]

[build-dependencies]
substrate-wasm-builder = { workspace = true, optional = true }

[lints]
workspace = true
