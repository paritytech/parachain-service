[package]
name = "asset-hub"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
codec = { workspace = true }
scale-info = { workspace = true }
frame = { workspace = true }

asset-hub-system = { workspace = true }

[features]
default = [
	"std",
]
std = [
	"asset-hub-system/std",
	"codec/std",
	"frame/std",
	"jam-types/std",
	"scale-info/std",
	"substrate-wasm-builder",
]
runtime-benchmarks = [
	"asset-hub-system/runtime-benchmarks",
	"frame/runtime-benchmarks",
]
try-runtime = [
	"asset-hub-system/try-runtime",
	"frame/try-runtime",
]

[build-dependencies]
substrate-wasm-builder = { workspace = true, optional = true }

[dev-dependencies]
jam-codec = { version = "0.1.1", features = ["derive"] }
jam-types = { workspace = true }
# Embedded PVM blobs for the refine test (built by their own `build.rs`), so a bare
# `cargo test` needs no prior `just build`.
parachain-service-bin = { workspace = true }
parachain-authorizer-bin = { workspace = true }
parachain-support = { workspace = true }

[lints]
workspace = true
