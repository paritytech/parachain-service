[package]
name = "parachain-authorizer"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

# Plain `rlib` (the default): see the note in `service/Cargo.toml`. This crate is not a blob of
# its own; `parachain-authorizer-{ed25519,sr25519}` are, and each build-depends on itself for
# `MANIFEST_DIR` while `jam-pvm-builder` forces `--crate-type=cdylib` for the blob.

[lints]
workspace = true

[dependencies]
jam-types = { workspace = true }
parachain-service-interface = { workspace = true }
jam-pvm-common = { workspace = true, features = ["authorizer", "logging"] }
codec = { workspace = true }
# `uninline_portable` keeps blake2b's compression function a real function instead of one fully
# unrolled body. It is worth ~13 kB of the 64 kB authorizer ceiling, and the authorizer hashes a
# few dozen bytes per call.
blake2b_simd = { workspace = true, features = ["uninline_portable"] }
primitive-types = { workspace = true }

# The cross-scheme contract tests live here, next to the core they are the drift alarm for: they
# check that a token assembled the node's way passes the matching verifier and no other. Cargo
# allows a dev-dependency cycle, which is what these two are.
[dev-dependencies]
parachain-authorizer = { path = ".", features = ["test-utils"] }
parachain-authorizer-ed25519 = { workspace = true }
parachain-authorizer-sr25519 = { workspace = true }
parachain-service = { workspace = true, features = ["std"] }
sp-core = { workspace = true, features = ["std"] }
sp-keystore = { workspace = true }

[features]
std = [
	"blake2b_simd/std",
	"codec/std",
	"jam-pvm-common/std",
	"jam-types/std",
	"parachain-authorizer/std",
	"parachain-service-interface/std",
	"parachain-service/std",
	"primitive-types/std",
	"sp-core/std",
]
test-utils = [
	"parachain-authorizer/test-utils",
	"parachain-service/test-utils",
]
