[package]
name = "parachain-authorizer"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

# Plain `rlib` (the default): see the note in `service/Cargo.toml`. The
# `parachain-authorizer-bin` wrapper build-depends on this crate for `MANIFEST_DIR`,
# and `jam-pvm-builder` forces `--crate-type=cdylib` when building the blob.

[lints]
workspace = true

[dependencies]
jam-types = { workspace = true }
parachain-support = { workspace = true }
jam-pvm-common = { workspace = true, features = ["authorizer", "logging"] }
polkavm-derive = { workspace = true }
codec = { workspace = true }
binary-merkle-tree = { workspace = true }
blake2b_simd = { workspace = true }
primitive-types = { workspace = true }

[dev-dependencies]
parachain-service = { workspace = true }
parachain-authorizer = { path = ".", features = ["test-utils"] }

[features]
std = [
	"binary-merkle-tree/std",
	"blake2b_simd/std",
	"codec/std",
	"jam-pvm-common/std",
	"jam-types/std",
	"primitive-types/std",
]
test-utils = []
