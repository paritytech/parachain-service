[package]
name = "parachain-authorizer"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

# The ed25519 and sr25519 crates provide the verifier blobs.

[lints]
workspace = true

[dependencies]
primitive-types = { workspace = true }
parachain-service-core = { workspace = true }
jam-types = { workspace = true }
cumulus-aura-authorizer-utils = { workspace = true }
jam-pvm-common = { workspace = true, features = ["authorizer", "logging"] }
codec = { workspace = true }
# Enables smaller compression code in the SDK hashing dependency to fit the guest size limit.
blake2b_simd = { workspace = true, features = ["uninline_portable"] }

# The scheme crates depend on this library; Cargo permits this cycle for tests.
[dev-dependencies]
primitive-types = { workspace = true }
parachain-authorizer-ed25519 = { workspace = true }
parachain-authorizer-sr25519 = { workspace = true }
parachain-service = { workspace = true, features = ["std", "test-utils"] }
sp-core = { workspace = true, features = ["std"] }
sp-keystore = { workspace = true }

[features]
std = [
	"blake2b_simd/std",
	"codec/std",
	"jam-pvm-common/std",
	"jam-types/std",
	"cumulus-aura-authorizer-utils/std",
	"parachain-service-core/std",
	"parachain-service/std",
	"primitive-types/std",
	"sp-core/std",
]
test-utils = [
	"parachain-service/test-utils",
]
