[package]
name = "jam-rpc-interface"
description = "Implementation of the jam-interface traits over a websocket to a JAM node"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
async-stream = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
futures = { workspace = true }
jam-interface = { workspace = true }
jam-std-common = { workspace = true }
jam-types = { workspace = true, features = ["std"] }
jsonrpsee = { workspace = true, features = ["ws-client"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
