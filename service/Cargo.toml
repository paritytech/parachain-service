[package]
name = "parachain-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

# Plain `rlib` (the default): the `parachain-service-bin` wrapper build-depends on
# this crate to read `MANIFEST_DIR`, and `jam-pvm-builder` forces `--crate-type=cdylib`
# on its own inner build when producing the PVM blob — so no `cdylib` is needed here.

[lints]
workspace = true

[dependencies]
jam-types = { workspace = true }
parachain-support = { workspace = true }
jam-pvm-common = { workspace = true, features = ["service", "logging"] }
codec = { workspace = true }
polkavm-derive = { workspace = true }
jam-std-common = { workspace = true, optional = true }
parachain-authorizer = { workspace = true }

[features]
test-utils = []
std = [ "dep:jam-std-common" ]
