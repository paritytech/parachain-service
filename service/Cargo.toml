[package]
name = "parachain-service"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

# Plain `rlib` (the default): `cargo-jam-build` passes `--crate-type=cdylib` on its own inner
# build when producing the PVM blob, so no `cdylib` is needed here.

[lints]
workspace = true

[dependencies]
jam-types = { workspace = true }
jam-codec = { workspace = true }
parachain-service-core = { workspace = true }
jam-pvm-common = { workspace = true, features = ["service", "logging"] }
codec = { workspace = true }
polkavm-derive = { workspace = true }
jam-std-common = { workspace = true, optional = true }
parachain-authorizer = { workspace = true }
bounded-collections = { workspace = true }
polkavm = { workspace = true }
blake2b_simd = { workspace = true }
tiny-keccak = { workspace = true }

[features]
test-utils = [
	"parachain-authorizer/test-utils",
]
std = [
	"blake2b_simd/std",
	"bounded-collections/std",
	"codec/std",
	"dep:jam-std-common",
	"jam-codec/std",
	"jam-pvm-common/std",
	"jam-types/std",
	"parachain-authorizer/std",
	"parachain-service-core/std",
	"polkavm/std",
]

[package.metadata.jam]
type = "service"
