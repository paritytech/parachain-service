[package]
name = "executor"
version.workspace = true
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
anyhow = { version = "1", optional = true }
codec = { package = "parity-scale-codec", version = "3", optional = true }
jam-node = { path = "../../vendor/polkajam/crates/node", default-features = false, features = ["hazmat"], optional = true }
jam-program-blob-common = { path = "../../vendor/polkajam/crates/jam-program-blob/common", optional = true }
env_logger = { version = "0.11", optional = true }
jam-std-common = { path = "../../vendor/polkajam/crates/jam-std-common", optional = true }
jam-types = { path = "../../vendor/polkajam/crates/jam-types", features = ["std"], optional = true }
polkavm = { version = "0.36.0", optional = true }
sc-executor = { path = "../../vendor/polkadot-sdk-companion/substrate/client/executor", optional = true }
sp-core = { path = "../../vendor/polkadot-sdk-companion/substrate/primitives/core", optional = true }
sp-io = { path = "../../vendor/polkadot-sdk-companion/substrate/primitives/io", optional = true }
sp-runtime = { path = "../../vendor/polkadot-sdk-companion/substrate/primitives/runtime", optional = true }
sp-state-machine = { path = "../../vendor/polkadot-sdk-companion/substrate/primitives/state-machine", optional = true }
sp-version = { path = "../../vendor/polkadot-sdk-companion/substrate/primitives/version", optional = true }

[features]
default = []
# Execute service entry points with the real polkajam node host.
jam = [
    "dep:anyhow",
    "dep:env_logger",
    "dep:jam-node",
    "dep:jam-std-common",
    "dep:jam-types",
]
# Execute Substrate runtime blobs through sc-executor's PolkaVM backend.
runtime = [
    "dep:anyhow",
    "dep:codec",
    "dep:sc-executor",
    "dep:sp-core",
    "dep:sp-io",
    "dep:sp-runtime",
    "dep:sp-state-machine",
    "dep:sp-version",
]
# Execute JAM service blobs on a bare PolkaVM with a caller-provided host.
service = [
    "dep:anyhow",
    "dep:jam-program-blob-common",
    "dep:polkavm",
]
