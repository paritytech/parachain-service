# Standalone harness for running parachain PVM blobs natively, for debugging.
#
# Two backends:
#   * `runtime` — Substrate runtime blobs (`*.polkavm`) via `sc-executor`'s
#     `WasmExecutor` (PolkaVM backend), resolving `sp_io` host functions by name.
#   * `service` — JAM service blobs (`*.jam`) via a bare PolkaVM engine, with JAM
#     host calls dispatched by numeric `ecalli` index (see `src/host.rs`).
#
# This is its OWN workspace on purpose: it path-depends on the polkadot-sdk
# companion submodule (a large dependency tree incl. wasmtime), and we don't want
# that pulled into the main parachain-service workspace / dev loop.
[package]
name = "executor"
version = "0.1.0"
edition = "2021"
publish = false

# Empty table => standalone workspace, isolated from the parent workspace.
[workspace]

[dependencies]
# --- runtime backend: Substrate WasmExecutor (PolkaVM) ---
sc-executor = { path = "../../vendor/polkadot-sdk-companion/substrate/client/executor" }
sp-io = { path = "../../vendor/polkadot-sdk-companion/substrate/primitives/io" }
sp-core = { path = "../../vendor/polkadot-sdk-companion/substrate/primitives/core" }
sp-version = { path = "../../vendor/polkadot-sdk-companion/substrate/primitives/version" }
sp-runtime = { path = "../../vendor/polkadot-sdk-companion/substrate/primitives/runtime" }
sp-state-machine = { path = "../../vendor/polkadot-sdk-companion/substrate/primitives/state-machine" }
codec = { package = "parity-scale-codec", version = "3" }

# --- service backend: bare PolkaVM (JAM) ---
# Our own 0.36 run-loop (src/service.rs) still exists; the polkajam node's host
# runs on 0.30. Both PolkaVM majors coexist in the graph — each backend uses
# exactly one, and JamV1 blobs are portable across them.
polkavm = "0.36.0"
# JAM crates pinned to the *vendored polkajam sources* so they are a single,
# shared instance with the `jam-node` dev-dependency (a crates.io copy would be a
# distinct, type-incompatible crate that the node's contexts wouldn't accept).
jam-program-blob-common = { path = "../../vendor/polkajam/crates/jam-program-blob/common" }
jam-types = { path = "../../vendor/polkajam/crates/jam-types", features = ["std"] }
jam-codec = { version = "0.1.1", features = ["derive"] }

# --- CLI / util ---
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
anyhow = "1"

# --- reuse the node's in-memory JAM host (Storage + Engine + contexts) ---
# Used ONLY by the tests in `src/jam_backend.rs`, so it lives in dev-dependencies
# and never touches the CLI binary. `hazmat` exposes `jam_node::vm`
# (Engine, {Refine,Accumulate}CallContext, Storage, ...). No polkadot-sdk deps in
# this subtree; it brings its own PolkaVM 0.30 (the CLI binary only links 0.36).
# jam-node uses an undeclared unstable feature (`substr_range`), so `cargo test`
# needs `RUSTC_BOOTSTRAP=1` — see the `just service test` recipe.
[dev-dependencies]
jam-node = { path = "../../vendor/polkajam/crates/node", default-features = false, features = ["hazmat"] }
jam-std-common = { path = "../../vendor/polkajam/crates/jam-std-common" }
# So `RUST_LOG=jam_node=trace,pvm=trace` surfaces the node's host-call trace.
env_logger = "0.11"
